<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="pj-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="pj-shine" cx="28%" cy="12%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pj-depth" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#1E3A5F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E3A5F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pj-folder-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C4DDFB"/>
      <stop offset="50%" stop-color="#8DC0EC"/>
      <stop offset="100%" stop-color="#6BAADE"/>
    </linearGradient>
    <linearGradient id="pj-folder-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF2FD"/>
      <stop offset="50%" stop-color="#C4DAFB"/>
      <stop offset="100%" stop-color="#A2C8F0"/>
    </linearGradient>
    <linearGradient id="pj-tab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B0D0F8"/>
      <stop offset="100%" stop-color="#7AAFE8"/>
    </linearGradient>
    <filter id="pj-shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#1E3A5F" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#pj-bg)"/>
  <rect width="120" height="120" rx="26" fill="url(#pj-depth)"/>
  <rect width="120" height="120" rx="26" fill="url(#pj-shine)"/>
  <g filter="url(#pj-shadow)">
    <rect x="20" y="40" width="80" height="55" rx="7" fill="url(#pj-folder-back)"/>
    <path d="M20 40 L20 34 C20 31 22 29 25 29 L46 29 C48 29 50 30 51 32 L55 38 L20 38 Z" fill="url(#pj-tab)"/>
    <rect x="20" y="48" width="80" height="47" rx="7" fill="url(#pj-folder-front)"/>
  </g>
  <rect x="20" y="48" width="80" height="10" rx="7" fill="white" opacity="0.22"/>
  <rect x="22" y="85" width="76" height="8" rx="5" fill="#1D4ED8" opacity="0.08"/>
  <!-- Code bracket with gear hint -->
  <text x="52" y="77" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#1D4ED8" opacity="0.5">{</text>
  <text x="68" y="77" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#1D4ED8" opacity="0.5">}</text>
  <circle cx="60" cy="72" r="5" fill="none" stroke="#1D4ED8" stroke-width="1.5" opacity="0.35"/>
  <rect width="120" height="120" rx="26" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.75"/>
  <rect x="0" y="0" width="120" height="1.5" rx="1" fill="white" opacity="0.15"/>
