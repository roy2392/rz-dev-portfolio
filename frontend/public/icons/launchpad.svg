<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="lp-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58585C"/>
      <stop offset="15%" stop-color="#3A3A3E"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>
    <radialGradient id="lp-shine" cx="28%" cy="10%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="lp-glow">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lp-dot-shadow">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0a0a0a" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#lp-bg)"/>
  <rect width="120" height="120" rx="26" fill="url(#lp-shine)"/>
  <g filter="url(#lp-dot-shadow)">
    <g filter="url(#lp-glow)">
      <circle cx="37" cy="38" r="11" fill="#ff453a"/>
      <circle cx="60" cy="38" r="11" fill="#30d158"/>
      <circle cx="83" cy="38" r="11" fill="#0a84ff"/>
      <circle cx="37" cy="60" r="11" fill="#ff9f0a"/>
      <circle cx="60" cy="60" r="11" fill="#bf5af2"/>
      <circle cx="83" cy="60" r="11" fill="#64d2ff"/>
      <circle cx="37" cy="82" r="11" fill="#ffd60a"/>
      <circle cx="60" cy="82" r="11" fill="#ff375f"/>
      <circle cx="83" cy="82" r="11" fill="#30d158"/>
    </g>
  </g>
  <!-- Highlight spots -->
  <circle cx="33" cy="34" r="4.5" fill="white" opacity="0.35"/>
  <circle cx="56" cy="34" r="4.5" fill="white" opacity="0.35"/>
  <circle cx="79" cy="34" r="4.5" fill="white" opacity="0.35"/>
  <circle cx="33" cy="56" r="4.5" fill="white" opacity="0.35"/>
  <circle cx="56" cy="56" r="4.5" fill="white" opacity="0.35"/>
  <circle cx="79" cy="56" r="4.5" fill="white" opacity="0.35"/>
  <circle cx="33" cy="78" r="4.5" fill="white" opacity="0.35"/>
  <circle cx="56" cy="78" r="4.5" fill="white" opacity="0.35"/>
  <circle cx="79" cy="78" r="4.5" fill="white" opacity="0.35"/>
  <rect width="120" height="120" rx="26" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.75"/>
  <rect x="0" y="0" width="120" height="1.5" rx="1" fill="white" opacity="0.1"/>
</svg>
