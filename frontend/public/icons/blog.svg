<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="25%" stop-color="#FDBA74"/>
      <stop offset="55%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="bl-shine" cx="28%" cy="12%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bl-depth" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#7C2D12" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C2D12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bl-page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBF5"/>
      <stop offset="100%" stop-color="#F5E6D3"/>
    </linearGradient>
    <linearGradient id="bl-ribbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="bl-shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#7C2D12" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bl-bg)"/>
  <rect width="120" height="120" rx="26" fill="url(#bl-depth)"/>
  <rect width="120" height="120" rx="26" fill="url(#bl-shine)"/>
  <g filter="url(#bl-shadow)">
    <rect x="34" y="24" width="6" height="72" rx="2" fill="#C2410C" opacity="0.45"/>
    <path d="M37 26 C37 26 38 28 58 30 L58 94 C38 92 37 90 37 90 Z" fill="url(#bl-page)" opacity="0.92"/>
    <path d="M62 30 C82 28 83 26 83 26 L83 90 C83 90 82 92 62 94 Z" fill="url(#bl-page)"/>
  </g>
  <!-- Page lines left -->
  <line x1="42" y1="40" x2="55" y2="41" stroke="#C2410C" stroke-width="0.8" opacity="0.18"/>
  <line x1="42" y1="48" x2="55" y2="49" stroke="#C2410C" stroke-width="0.8" opacity="0.18"/>
  <line x1="42" y1="56" x2="55" y2="57" stroke="#C2410C" stroke-width="0.8" opacity="0.18"/>
  <line x1="42" y1="64" x2="55" y2="65" stroke="#C2410C" stroke-width="0.8" opacity="0.18"/>
  <line x1="42" y1="72" x2="55" y2="73" stroke="#C2410C" stroke-width="0.8" opacity="0.18"/>
  <!-- Page lines right -->
  <line x1="65" y1="41" x2="78" y2="40" stroke="#C2410C" stroke-width="0.8" opacity="0.18"/>
  <line x1="65" y1="49" x2="78" y2="48" stroke="#C2410C" stroke-width="0.8" opacity="0.18"/>
  <line x1="65" y1="57" x2="78" y2="56" stroke="#C2410C" stroke-width="0.8" opacity="0.18"/>
  <line x1="65" y1="65" x2="78" y2="64" stroke="#C2410C" stroke-width="0.8" opacity="0.18"/>
  <line x1="65" y1="73" x2="78" y2="72" stroke="#C2410C" stroke-width="0.8" opacity="0.18"/>
  <!-- Bookmark ribbon -->
  <path d="M72 24 L72 42 L75 38 L78 42 L78 24 Z" fill="url(#bl-ribbon)" opacity="0.85"/>
  <!-- Page shine -->
  <path d="M62 30 C72 29 80 27 83 26 L83 34 C80 35 72 37 62 38 Z" fill="white" opacity="0.22"/>
  <rect width="120" height="120" rx="26" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.75"/>
  <rect x="0" y="0" width="120" height="1.5" rx="1" fill="white" opacity="0.18"/>
</svg>
