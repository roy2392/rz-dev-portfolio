<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="ab-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="50%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0055D4"/>
    </linearGradient>
    <radialGradient id="ab-shine" cx="35%" cy="25%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ab-compass-ring" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#ab-bg)"/>
  <rect width="120" height="120" rx="26" fill="url(#ab-shine)"/>
  <!-- Compass outer ring -->
  <circle cx="60" cy="60" r="36" fill="none" stroke="url(#ab-compass-ring)" stroke-width="3" opacity="0.9"/>
  <!-- Cardinal ticks -->
  <line x1="60" y1="26" x2="60" y2="32" stroke="white" stroke-width="2.5" opacity="0.9"/>
  <line x1="60" y1="88" x2="60" y2="94" stroke="white" stroke-width="2.5" opacity="0.9"/>
  <line x1="26" y1="60" x2="32" y2="60" stroke="white" stroke-width="2.5" opacity="0.9"/>
  <line x1="88" y1="60" x2="94" y2="60" stroke="white" stroke-width="2.5" opacity="0.9"/>
  <!-- Compass needle - red/white -->
  <polygon points="60,30 54,60 60,56 66,60" fill="#FF3B30"/>
  <polygon points="60,90 54,60 60,64 66,60" fill="white" opacity="0.9"/>
  <!-- Center dot -->
  <circle cx="60" cy="60" r="3" fill="white"/>
</svg>
