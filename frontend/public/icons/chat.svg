<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="ch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="30%" stop-color="#4ADE80"/>
      <stop offset="65%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <radialGradient id="ch-shine" cx="28%" cy="12%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ch-depth" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#14532D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14532D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ch-bubble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <filter id="ch-shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#14532D" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#ch-bg)"/>
  <rect width="120" height="120" rx="26" fill="url(#ch-depth)"/>
  <rect width="120" height="120" rx="26" fill="url(#ch-shine)"/>
  <!-- Main speech bubble -->
  <g filter="url(#ch-shadow)">
    <path d="M25 34 C25 26 31 20 39 20 L81 20 C89 20 95 26 95 34 L95 58 C95 66 89 72 81 72 L50 72 L36 86 L38 72 L39 72 C31 72 25 66 25 58 Z" fill="url(#ch-bubble)" opacity="0.95"/>
  </g>
  <!-- Bubble shine -->
  <path d="M31 34 C31 29 35 24 41 24 L79 24 C83 24 87 26 89 29 L31 29 Z" fill="white" opacity="0.3"/>
  <!-- Small bubble in corner -->
  <circle cx="88" cy="82" r="10" fill="url(#ch-bubble)" opacity="0.8"/>
  <circle cx="97" cy="90" r="5" fill="url(#ch-bubble)" opacity="0.6"/>
  <!-- Bubble highlight -->
  <circle cx="85" cy="79" r="4" fill="white" opacity="0.25"/>
  <rect width="120" height="120" rx="26" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.75"/>
  <rect x="0" y="0" width="120" height="1.5" rx="1" fill="white" opacity="0.18"/>
</svg>
