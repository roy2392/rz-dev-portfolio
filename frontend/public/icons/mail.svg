<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="ml-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="30%" stop-color="#3B82F6"/>
      <stop offset="65%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="ml-shine" cx="28%" cy="12%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ml-depth" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#1E3A5F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E3A5F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ml-env-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F0F4FA"/>
      <stop offset="100%" stop-color="#E0E8F2"/>
    </linearGradient>
    <linearGradient id="ml-flap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F8FC"/>
      <stop offset="100%" stop-color="#D0DCE8"/>
    </linearGradient>
    <linearGradient id="ml-paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAFBFC"/>
      <stop offset="100%" stop-color="#E8ECF2"/>
    </linearGradient>
    <filter id="ml-shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E3A5F" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#ml-bg)"/>
  <rect width="120" height="120" rx="26" fill="url(#ml-depth)"/>
  <rect width="120" height="120" rx="26" fill="url(#ml-shine)"/>
  <g filter="url(#ml-shadow)">
    <!-- Inner paper peeking out -->
    <rect x="26" y="32" width="68" height="44" rx="3" fill="url(#ml-paper)" opacity="0.6"/>
    <line x1="36" y1="42" x2="72" y2="42" stroke="#1D4ED8" stroke-width="0.7" opacity="0.1"/>
    <line x1="36" y1="48" x2="84" y2="48" stroke="#1D4ED8" stroke-width="0.7" opacity="0.1"/>
    <line x1="36" y1="54" x2="78" y2="54" stroke="#1D4ED8" stroke-width="0.7" opacity="0.1"/>
    <!-- Envelope body -->
    <rect x="18" y="38" width="84" height="54" rx="7" fill="url(#ml-env-body)"/>
  </g>
  <!-- Bottom fold lines -->
  <path d="M18 92 L54 66" fill="none" stroke="#1D4ED8" stroke-width="0.8" opacity="0.08"/>
  <path d="M102 92 L66 66" fill="none" stroke="#1D4ED8" stroke-width="0.8" opacity="0.08"/>
  <!-- Sealed flap -->
  <path d="M18 42 C18 40 19 38 21 38 L99 38 C101 38 102 40 102 42 L60 72 Z" fill="url(#ml-flap)" opacity="0.96"/>
  <path d="M20 40 L60 68 L100 40" fill="none" stroke="#A8BCD4" stroke-width="1" opacity="0.5"/>
  <path d="M24 42 L60 66 L96 42" fill="none" stroke="#1D4ED8" stroke-width="1.5" opacity="0.06"/>
  <!-- Envelope top shine -->
  <rect x="18" y="38" width="84" height="8" rx="7" fill="white" opacity="0.18"/>
  <rect width="120" height="120" rx="26" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.75"/>
  <rect x="0" y="0" width="120" height="1.5" rx="1" fill="white" opacity="0.15"/>
</svg>
