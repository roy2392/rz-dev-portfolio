<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="ml-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64D2FF"/>
      <stop offset="50%" stop-color="#34AADC"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <radialGradient id="ml-shine" cx="40%" cy="20%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#ml-bg)"/>
  <rect width="120" height="120" rx="26" fill="url(#ml-shine)"/>
  <!-- Envelope body -->
  <rect x="22" y="38" width="76" height="48" rx="5" fill="white" opacity="0.9"/>
  <!-- Envelope flap -->
  <path d="M22 42 L60 66 L98 42" fill="none" stroke="white" stroke-width="3" opacity="0.95"/>
  <!-- Inner shadow on envelope -->
  <path d="M22 86 L52 64" fill="none" stroke="#007AFF" stroke-width="1" opacity="0.15"/>
  <path d="M98 86 L68 64" fill="none" stroke="#007AFF" stroke-width="1" opacity="0.15"/>
</svg>
