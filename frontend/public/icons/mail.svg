<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="ml-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <radialGradient id="ml-shine" cx="28%" cy="12%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ml-depth" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#0C4A6E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ml-env-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8EFF5"/>
    </linearGradient>
    <linearGradient id="ml-flap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#D8E2EC"/>
    </linearGradient>
    <filter id="ml-shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0C4A6E" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#ml-bg)"/>
  <rect width="120" height="120" rx="26" fill="url(#ml-depth)"/>
  <rect width="120" height="120" rx="26" fill="url(#ml-shine)"/>
  <g filter="url(#ml-shadow)">
    <!-- Envelope body -->
    <rect x="20" y="36" width="80" height="52" rx="6" fill="url(#ml-env-body)"/>
  </g>
  <!-- Bottom fold lines -->
  <path d="M20 88 L54 62" fill="none" stroke="#0369A1" stroke-width="1" opacity="0.1"/>
  <path d="M100 88 L66 62" fill="none" stroke="#0369A1" stroke-width="1" opacity="0.1"/>
  <!-- Flap (V shape on top) -->
  <path d="M20 40 C20 38 21 36 23 36 L97 36 C99 36 100 38 100 40 L60 68 Z" fill="url(#ml-flap)" opacity="0.95"/>
  <!-- Flap fold line -->
  <path d="M22 38 L60 64 L98 38" fill="none" stroke="#B0C4D8" stroke-width="1" opacity="0.5"/>
  <!-- Inner shadow at flap crease -->
  <path d="M26 40 L60 62 L94 40" fill="none" stroke="#0369A1" stroke-width="1.5" opacity="0.08"/>
  <!-- Envelope shine -->
  <rect x="20" y="36" width="80" height="8" rx="6" fill="white" opacity="0.15"/>
  <!-- Paper texture lines -->
  <line x1="36" y1="72" x2="84" y2="72" stroke="#0369A1" stroke-width="0.5" opacity="0.06"/>
  <line x1="36" y1="78" x2="84" y2="78" stroke="#0369A1" stroke-width="0.5" opacity="0.06"/>
  <line x1="36" y1="84" x2="70" y2="84" stroke="#0369A1" stroke-width="0.5" opacity="0.06"/>
  <!-- Glass edge top -->
  <rect x="0" y="0" width="120" height="2" rx="1" fill="white" opacity="0.12"/>
</svg>
