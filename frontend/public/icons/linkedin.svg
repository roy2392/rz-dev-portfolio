<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="li-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2EB5F6"/>
      <stop offset="35%" stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#004182"/>
    </linearGradient>
    <radialGradient id="li-shine" cx="28%" cy="12%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="li-depth" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#002851" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#002851" stop-opacity="0"/>
    </radialGradient>
    <filter id="li-text-shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#002851" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#li-bg)"/>
  <rect width="120" height="120" rx="26" fill="url(#li-depth)"/>
  <rect width="120" height="120" rx="26" fill="url(#li-shine)"/>
  <g filter="url(#li-text-shadow)">
    <text x="26" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" fill="white" opacity="0.95">in</text>
  </g>
  <!-- Glass edge top -->
  <rect x="0" y="0" width="120" height="2" rx="1" fill="white" opacity="0.12"/>
</svg>
