<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="li-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3DBDF6"/>
      <stop offset="30%" stop-color="#0A66C2"/>
      <stop offset="70%" stop-color="#085BA8"/>
      <stop offset="100%" stop-color="#004182"/>
    </linearGradient>
    <radialGradient id="li-shine" cx="28%" cy="12%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="li-depth" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#002851" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#002851" stop-opacity="0"/>
    </radialGradient>
    <filter id="li-text-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#002851" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#li-bg)"/>
  <rect width="120" height="120" rx="26" fill="url(#li-depth)"/>
  <rect width="120" height="120" rx="26" fill="url(#li-shine)"/>
  <g filter="url(#li-text-shadow)">
    <text x="26" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" fill="white" opacity="0.95">in</text>
  </g>
  <!-- Emboss highlight on text -->
  <text x="26" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" fill="white" opacity="0.08">in</text>
  <rect width="120" height="120" rx="26" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.75"/>
  <rect x="0" y="0" width="120" height="1.5" rx="1" fill="white" opacity="0.15"/>
</svg>
